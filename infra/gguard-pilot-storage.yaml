AWSTemplateFormatVersion: "2010-09-09"
Description: Private S3 storage and least-privilege access role for the GGuard paid pilot

Parameters:
  Environment:
    Type: String
    Default: pilot
    AllowedValues:
      - pilot
      - production
  AllowedWebOrigin:
    Type: String
    Default: https://ggaurdai.com
    AllowedPattern: "^https://[A-Za-z0-9.-]+(:[0-9]+)?$"

Resources:
  MediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: false
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - HEAD
              - PUT
            AllowedOrigins:
              - !Ref AllowedWebOrigin
            ExposedHeaders:
              - ETag
              - x-amz-request-id
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: ExpireNoncurrentVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Application
          Value: GGuard
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
      VersioningConfiguration:
        Status: Enabled

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt MediaBucket.Arn
              - !Sub "${MediaBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  StorageRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Least-privilege role for GGuard private pilot media storage
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountPrincipalsWithAssumePermission
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: "sts:AssumeRole"
      Policies:
        - PolicyName: PrivateMediaBucketAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: BucketMetadata
                Effect: Allow
                Action:
                  - "s3:GetBucketLocation"
                  - "s3:ListBucket"
                  - "s3:ListBucketMultipartUploads"
                Resource: !GetAtt MediaBucket.Arn
              - Sid: PrivateMediaObjects
                Effect: Allow
                Action:
                  - "s3:AbortMultipartUpload"
                  - "s3:DeleteObject"
                  - "s3:GetObject"
                  - "s3:GetObjectVersion"
                  - "s3:ListMultipartUploadParts"
                  - "s3:PutObject"
                Resource: !Sub "${MediaBucket.Arn}/pre-dispatch/*"
      Tags:
        - Key: Application
          Value: GGuard
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  BootstrapUser:
    Type: AWS::IAM::User
    Properties:
      Policies:
        - PolicyName: AssumeStorageRoleOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AssumeStorageRole
                Effect: Allow
                Action: "sts:AssumeRole"
                Resource: !GetAtt StorageRole.Arn
      Tags:
        - Key: Application
          Value: GGuard
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  BucketName:
    Description: Private bucket used for GGuard pilot media
    Value: !Ref MediaBucket
  StorageRoleArn:
    Description: Least-privilege role ARN for private bucket access
    Value: !GetAtt StorageRole.Arn
  BootstrapUserName:
    Description: IAM user allowed only to assume the storage role
    Value: !Ref BootstrapUser
  StoragePrefix:
    Description: Object prefix allowed by the storage role
    Value: pre-dispatch/
